name: Patch and inspect Gboard
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        api: ['31', '37.0']
    timeout-minutes: 35
    env:
      QEMU_AUDIO_DRV: pa
      GBOARD_SIGNING_PASSWORD: ${{ secrets.GBOARD_SIGNING_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Test binary manifest patch boundaries
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
          cmdline-tools-version: '15859902'
      - name: Keep emulator runner on the pinned SDK tools
        run: |
          sdk_toolroot="$(dirname "$(dirname "$(command -v sdkmanager)")")"
          if [[ "$sdk_toolroot" != "$ANDROID_HOME/cmdline-tools/latest" ]]; then
            rm -rf "$ANDROID_HOME/cmdline-tools/latest"
            ln -s "$sdk_toolroot" "$ANDROID_HOME/cmdline-tools/latest"
          fi
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version
      - name: Install Android build tools
        run: sdkmanager 'build-tools;35.0.0' 'platforms;android-35'
      - name: Install pinned APK download client
        run: python3 -m pip install -r requirements-build.txt
      - name: Load persistent APK signing key
        env:
          GBOARD_SIGNING_KEYSTORE: ${{ secrets.GBOARD_SIGNING_KEYSTORE }}
        run: |
          python3 - <<'PY'
          import base64, os, pathlib
          p = pathlib.Path('work/signing/gboard-offline.p12')
          p.parent.mkdir(parents=True, exist_ok=True)
          fd = os.open(p, os.O_CREAT | os.O_EXCL | os.O_WRONLY, 0o600)
          with os.fdopen(fd, 'wb') as f:
              f.write(base64.b64decode(os.environ['GBOARD_SIGNING_KEYSTORE'], validate=True))
          PY
      - name: Verify Google signatures and patch APKs
        run: |
          python3 scripts/build.py arm64
          python3 scripts/build.py x86_64
          bash scripts/build_probe.sh
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Remove disposable intermediate APK copies
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for arch in ('arm64', 'x86_64'):
              for apk in (Path('work') / arch).glob('*.apk'):
                  if apk.name != 'original.apk':
                      apk.unlink()
          PY
      - name: Prepare synthetic microphone audio
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pulseaudio pulseaudio-utils libpulse-dev espeak-ng xvfb libxcb-cursor0 libxkbcommon-x11-0
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=speech_input rate=16000 channels=1 channel_map=mono
          pactl load-module module-null-sink sink_name=discard_output
          pactl set-default-source speech_input.monitor
          pactl set-default-sink discard_output
          pactl load-module module-native-protocol-unix socket=/tmp/gboard-offline-pulse.sock auth-anonymous=1
          printf '%s\n' 'PULSE_SERVER=unix:/tmp/gboard-offline-pulse.sock' 'QEMU_PA_SERVER=unix:/tmp/gboard-offline-pulse.sock' 'PULSE_SOURCE=speech_input.monitor' 'QEMU_PA_SOURCE=speech_input.monitor' 'QEMU_PA_SAMPLES=1024' 'PULSE_SINK=discard_output' 'QEMU_PA_SINK=discard_output' >> "$GITHUB_ENV"
          espeak-ng -v en-us -s 135 -w work/hello-world.wav 'hello world'
          Xvfb -displayfd 3 -screen 0 1080x1920x24 -nolisten tcp 3>work/xvfb-display >work/xvfb.log 2>&1 &
          for attempt in {1..50}; do
            [[ -s work/xvfb-display ]] && break
            sleep 0.1
          done
          test -s work/xvfb-display
          printf 'DISPLAY=:%s\n' "$(cat work/xvfb-display)" >> "$GITHUB_ENV"
      - name: Exercise patched keyboard in Android
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disk-size: 4G
          ram-size: 4096M
          cores: 4
          disable-animations: true
          emulator-options: -gpu software -no-snapshot -no-boot-anim -camera-back none -writable-system
          pre-emulator-launch-script: |
            pactl info
            ls -l /tmp/gboard-offline-pulse.sock /usr/lib/x86_64-linux-gnu/libpulse.so
            cat "$ANDROID_AVD_HOME/test.ini"
            grep -Fx 'target=android-${{ matrix.api }}' "$ANDROID_AVD_HOME/test.ini"
            $ANDROID_HOME/emulator/emulator -audio-help || true
          script: python3 scripts/emulator_test.py
      - name: Publish experimental APKs and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: experimental-gboard-and-evidence-api${{ matrix.api }}
          path: dist/
          retention-days: 7
          if-no-files-found: error
      - name: Publish small runtime evidence separately
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-evidence-api${{ matrix.api }}
          path: |
            dist/*/*.json
            dist/*/*.txt
            dist/*/*.xml
            dist/*/*.png
            dist/*/*.pcm
            dist/*/*.wav
          retention-days: 7
      - name: Summarize evidence
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          p = next((p for p in pathlib.Path('dist').glob('*/runtime-report.json')), pathlib.Path('dist/x86_64/runtime-report.json'))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('## Experimental Gboard permission patch\n\n')
              f.write('**Read offline_dictation_passed below. A successful build/keyboard check is not a speech-recognition pass or a phone privacy guarantee.**\n\n')
              if p.exists():
                  f.write('```json\n' + p.read_text() + '\n```\n')
          PY
