name: Patch and inspect Gboard
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      - name: Install Android build tools
        run: sdkmanager 'build-tools;35.0.0' 'platforms;android-35'
      - name: Verify Google signatures and patch APKs
        run: |
          python3 scripts/build.py arm64
          python3 scripts/build.py x86_64
          bash scripts/build_probe.sh
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise patched keyboard in Android 13
        uses: reactivecircus/android-emulator-runner@4c44018e59b437e86cdfc41da381398f93ed8808
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: python3 scripts/emulator_test.py
      - name: Publish experimental APKs and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: experimental-gboard-and-evidence
          path: dist/
          retention-days: 7
          if-no-files-found: error
      - name: Summarize evidence
        if: always()
        run: |
          python3 - <<'PY'
          import json, os, pathlib
          p = pathlib.Path('dist/x86_64/runtime-report.json')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('## Experimental Gboard permission patch\n\n')
              f.write('**Offline dictation is NOT verified. A successful job is not a speech-recognition pass.**\n\n')
              if p.exists():
                  f.write('```json\n' + p.read_text() + '\n```\n')
          PY
